<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatVault</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #ff4757;
      --accent-hover: #ff6b81;
      --text-color: #ffffff;
      --text-muted: #a4b0be;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    header {
      background-color: #0d0d0f;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid var(--accent-color);
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    /* עיצוב הטאבים */
    .tabs-container {
      display: flex;
      justify-content: center;
      background-color: #18181c;
      border-bottom: 1px solid #2f3542;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 15px 25px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 3px solid transparent;
    }

    .tab-btn:hover {
      color: var(--text-color);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: var(--accent-color);
      border-bottom: 3px solid var(--accent-color);
    }

    /* תוכן הטאבים */
    .tab-content {
      display: none;
      padding: 30px;
      max-width: 800px;
      margin: 0 auto;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>BEATVAULT</h1>
  </header>

  <!-- סרגל הטאבים -->
  <div class="tabs-container">
    <button class="tab-btn active" onclick="openTab('beats')">🎵 ביטים</button>
    <button class="tab-btn" onclick="openTab('generator')">⚙️ מחולל & BPM</button>
    <button class="tab-btn" onclick="openTab('about')">ℹ️ אודות</button>
  </div>

  <!-- תוכן טאב 1: ביטים -->
  <div id="beats" class="tab-content active">
    <div class="card">
      <h2>ספריית הביטים</h2>
      <p>כאן יופיע נגן הביטים והטראקים שלך.</p>
    </div>
  </div>

  <!-- תוכן טאב 2: מחולל/BPM -->
  <div id="generator" class="tab-content">
    <div class="card">
      <h2>הגדרות קצב ו-BPM</h2>
      <p>כאן תוכל לשלוט על ה-BPM וליצור מקצבים.</p>
    </div>
  </div>

  <!-- תוכן טאב 3: אודות -->
  <div id="about" class="tab-content">
    <div class="card">
      <h2>על BeatVault</h2>
      <p>פלטפורמה ליצירת ומעקב אחר ביטים ומקצבים.</p>
    </div>
  </div>

  <script>
    function openTab(tabId) {
      // הסרת מצב פעיל מכל הטאבים והתוכן
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
      });
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      // הפעלת הטאב והבלוק הנבחר
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
