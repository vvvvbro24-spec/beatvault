<button id="bv-beat-btn" aria-label="נגן ביט" style="position:fixed;bottom:20px;left:20px;z-index:9999;background:#b3121a;color:#fff;border:0;padding:12px 22px;font:700 15px system-ui,sans-serif;border-radius:4px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.5)">▶ נגן ביט</button>
<script>
(function (global) {
  'use strict';

  // ---------- הגדרות ----------
  const BPM = 140;
  const STEP = 60 / BPM / 4;
  const BAR = 16;
  const BARS = 4;
  const TOTAL = BAR * BARS;
  const LOOKAHEAD = 0.15;
  const TICK_MS = 25;
  const ROOT = 26; // D1

  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // ---------- פטרנים (4 תיבות) ----------
  const BASS = [
    [[0, 0, 3], [4, 0, 1], [6, 0, 2], [10, 1, 2], [13, 0, 3]],
    [[0, 0, 3], [4, 0, 1], [6, 3, 2], [10, 1, 2], [12, 0, 4]],
    [[0, 8, 3], [4, 8, 1], [6, 8, 2], [10, 7, 2], [13, 5, 3]],
    [[0, 1, 3], [4, 1, 1], [6, 0, 2], [8, 0, 1], [12, 0, 4]],
  ];
  const KICKS = [
    [0, 6, 10],
    [0, 6, 10, 14],
    [0, 3, 6, 10],
    [0, 6, 9, 10, 14],
  ];
  const SNARES = [
    [[8, 1]],
    [[8, 1]],
    [[8, 1]],
    [[8, 1], [13, 0.35], [14, 0.5], [15, 0.7]],
  ];
  const HATS = [
    'x-o-x-o-x-o-x-or',
    'x-ox-ox-x-o-x-rr',
    'x-o-x-o-x-o-x-O-',
    'x-o-x-ox-o-xrrrr',
  ];
  const MELODY = [
    [0, 50, 3],
    [8, 51, 3],
    [0, 46, 3],
    [8, 45, 3],
  ];

  // ---------- מצב ----------
  let ctx = null;
  let master, comp, drumBus, bassBus, melodyBus, droneBus, reverbSend;
  let noiseBuf, driveCurve;
  let playing = false;
  let timer = null;
  let nextTime = 0;
  let step = 0;
  let volume = 0.8;
  let droneNodes = [];

  // ---------- עזרים ----------
  function makeCurve(k) {
    const n = 2048;
    const c = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      c[i] = Math.tanh(x * k);
    }
    return c;
  }

  function makeImpulse(sec, decay) {
    const len = (ctx.sampleRate * sec) | 0;
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return b;
  }

  function noiseSrc(t, dur) {
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    s.start(t, Math.random() * 1.5, dur);
    return s;
  }

  function init() {
    if (ctx) return;
    ctx = new (global.AudioContext || global.webkitAudioContext)();

    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    driveCurve = makeCurve(4);

    master = ctx.createGain();
    master.gain.value = volume;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 12;
    comp.ratio.value = 5;
    comp.attack.value = 0.004;
    comp.release.value = 0.15;
    const clip = ctx.createWaveShaper();
    clip.curve = makeCurve(1.4);
    clip.oversample = '2x';
    comp.connect(clip);
    clip.connect(master);
    master.connect(ctx.destination);

    drumBus = ctx.createGain(); drumBus.gain.value = 0.9;
    bassBus = ctx.createGain(); bassBus.gain.value = 1;
    melodyBus = ctx.createGain(); melodyBus.gain.value = 0.3;
    droneBus = ctx.createGain(); droneBus.gain.value = 0.14;
    [drumBus, bassBus, melodyBus, droneBus].forEach((b) => b.connect(comp));

    reverbSend = ctx.createGain(); reverbSend.gain.value = 0.3;
    const reverb = ctx.createConvolver();
    reverb.buffer = makeImpulse(2.8, 3);
    const reverbRet = ctx.createGain(); reverbRet.gain.value = 0.5;
    reverbSend.connect(reverb);
    reverb.connect(reverbRet);
    reverbRet.connect(comp);
    droneBus.connect(reverbSend);
  }

  // ---------- כלים ----------
  function kick(t, v) {
    v = v || 1;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(g); g.connect(drumBus);
    o.start(t); o.stop(t + 0.5);

    const n = noiseSrc(t, 0.02);
    const f = ctx.createBiquadFilter();
    const ng = ctx.createGain();
    f.type = 'highpass'; f.frequency.value = 2000;
    ng.gain.setValueAtTime(0.35 * v, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.012);
    n.connect(f); f.connect(ng); ng.connect(drumBus);

    bassBus.gain.setValueAtTime(0.45, t);
    bassBus.gain.linearRampToValueAtTime(1, t + 0.12);
  }

  function snare(t, v) {
    v = v || 1;
    const n = noiseSrc(t, 0.3);
    const bp = ctx.createBiquadFilter();
    const g = ctx.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 0.8;
    g.gain.setValueAtTime(0.9 * v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    n.connect(bp); bp.connect(g); g.connect(drumBus); g.connect(reverbSend);

    const o = ctx.createOscillator();
    const og = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(130, t + 0.08);
    og.gain.setValueAtTime(0.6 * v, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(og); og.connect(drumBus);
    o.start(t); o.stop(t + 0.2);

    for (let i = 0; i < 3; i++) {
      const tt = t + i * 0.011;
      const cn = noiseSrc(tt, 0.1);
      const cf = ctx.createBiquadFilter();
      const cg = ctx.createGain();
      cf.type = 'bandpass'; cf.frequency.value = 1500; cf.Q.value = 1.2;
      cg.gain.setValueAtTime(0.5 * v, tt);
      cg.gain.exponentialRampToValueAtTime(0.001, tt + (i === 2 ? 0.14 : 0.02));
      cn.connect(cf); cf.connect(cg); cg.connect(drumBus);
      if (i === 2) cg.connect(reverbSend);
    }
  }

  function hat(t, v, open) {
    const n = noiseSrc(t, open ? 0.35 : 0.08);
    const hp = ctx.createBiquadFilter();
    const g = ctx.createGain();
    hp.type = 'highpass'; hp.frequency.value = 8000;
    g.gain.setValueAtTime(v * 0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.25 : 0.035));
    n.connect(hp); hp.connect(g); g.connect(drumBus);
  }

  function bass(t, semi, len) {
    const f = mtof(ROOT + semi);
    const dur = len * STEP;
    const o = ctx.createOscillator();
    const env = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f * 2, t);
    o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
    env.gain.setValueAtTime(0.0001, t);
    env.gain.linearRampToValueAtTime(1, t + 0.006);
    env.gain.setValueAtTime(1, t + Math.max(0.01, dur - 0.08));
    env.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.05);
    o.connect(env);
    env.connect(bassBus);

    const sh = ctx.createWaveShaper();
    sh.curve = driveCurve;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    const shg = ctx.createGain(); shg.gain.value = 0.45;
    env.connect(sh); sh.connect(lp); lp.connect(shg); shg.connect(bassBus);

    o.start(t); o.stop(t + dur + 0.1);
  }

  function pluck(t, midi, len) {
    const f = mtof(midi);
    const lp = ctx.createBiquadFilter();
    const g = ctx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 1200;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.8, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + len);
    lp.connect(g); g.connect(melodyBus); g.connect(reverbSend);

    [['triangle', f, 1], ['sine', f * 1.004, 0.7], ['sine', f * 2, 0.15]].forEach(([type, fr, amp]) => {
      const o = ctx.createOscillator();
      const og = ctx.createGain();
      o.type = type; o.frequency.value = fr;
      og.gain.value = amp;
      o.connect(og); og.connect(lp);
      o.start(t); o.stop(t + len + 0.1);
    });
  }

  function startDrone() {
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 380; lp.Q.value = 4;
    lp.connect(droneBus);

    const lfo = ctx.createOscillator();
    const lfoG = ctx.createGain();
    lfo.frequency.value = 0.07;
    lfoG.gain.value = 180;
    lfo.connect(lfoG); lfoG.connect(lp.frequency);
    lfo.start();
    droneNodes.push(lfo);

    [[38, 0, 1], [38, 9, 0.8], [45, 0, 0.5], [51, 0, 0.25]].forEach(([m, cents, amp]) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.value = mtof(m);
      o.detune.value = cents;
      g.gain.value = amp;
      o.connect(g); g.connect(lp);
      o.start();
      droneNodes.push(o);
    });
  }

  function stopDrone(when) {
    droneNodes.forEach((o) => { try { o.stop(when); } catch (e) {} });
    droneNodes = [];
  }

  // ---------- סקדולר ----------
  function scheduleStep(s, t) {
    const bar = (s / BAR) | 0;
    const i = s % BAR;

    BASS[bar].forEach((n) => { if (n[0] === i) bass(t, n[1], n[2]); });
    if (KICKS[bar].indexOf(i) !== -1) kick(t);
    SNARES[bar].forEach((n) => { if (n[0] === i) snare(t, n[1]); });

    const h = HATS[bar][i];
    if (h === 'x') hat(t, 1);
    else if (h === 'o') hat(t, 0.5);
    else if (h === 'O') hat(t, 0.8, true);
    else if (h === 'r') { hat(t, 0.7); hat(t + STEP / 2, 0.55); }

    const m = MELODY[bar];
    if (m && m[0] === i) pluck(t, m[1], m[2]);
  }

  function scheduler() {
    while (nextTime < ctx.currentTime + LOOKAHEAD) {
      scheduleStep(step, nextTime);
      nextTime += STEP;
      step = (step + 1) % TOTAL;
    }
  }

  // ---------- API ----------
  async function start() {
    if (playing) return;
    playing = true;
    init();
    if (ctx.state === 'suspended') await ctx.resume();
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(0.0001, now);
    master.gain.linearRampToValueAtTime(volume, now + 0.3);
    startDrone();
    step = 0;
    nextTime = now + 0.08;
    timer = setInterval(scheduler, TICK_MS);
  }

  function stop() {
    if (!playing) return;
    playing = false;
    clearInterval(timer);
    const now = ctx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(0.0001, now + 0.3);
    stopDrone(now + 0.4);
  }

  function toggle() {
    if (playing) stop(); else start();
    return playing;
  }

  function setVolume(v) {
    volume = Math.min(1, Math.max(0, v));
    if (ctx && playing) master.gain.setTargetAtTime(volume, ctx.currentTime, 0.05);
  }

  global.BeatVaultBeat = {
    start: start,
    stop: stop,
    toggle: toggle,
    setVolume: setVolume,
    isPlaying: function () { return playing; },
  };
})(window);

(function () {
  var btn = document.getElementById('bv-beat-btn');
  btn.addEventListener('click', function () {
    var on = BeatVaultBeat.toggle();
    btn.textContent = on ? '■ עצור ביט' : '▶ נגן ביט';
    btn.style.background = on ? '#222' : '#b3121a';
    btn.style.outline = on ? '1px solid #b3121a' : 'none';
  });
})();
</script>
