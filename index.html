<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEATS — Step Sequencer & Code Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0e;
    --panel: #141417;
    --cell: #1b1b20;
    --cell-beat: #232329;
    --line: #26262c;
    --text: #ebe8e1;
    --mute: #86868f;
    --accent: #ff5a36;
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button, select, input, textarea { font: inherit; color: inherit; }

  .app { max-width: 1180px; margin: 0 auto; padding: 28px 20px 48px; display: flex; flex-direction: column; gap: 18px; }

  /* ---------- Navigation Tabs ---------- */
  .tabs { display: flex; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .tab-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .tab-btn.active { background: var(--accent); color: #0c0c0e; border-color: var(--accent); font-weight: 700; }

  .tab-content { display: none; flex-direction: column; gap: 18px; }
  .tab-content.active { display: flex; }

  /* ---------- Header & Transport ---------- */
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; }
  .brand { font-weight: 700; letter-spacing: .34em; font-size: 14px; }
  .brand i { font-style: normal; color: var(--accent); }
  .transport { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; }

  .play {
    width: 50px; height: 50px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); display: grid; place-items: center; transition: transform .12s, filter .12s;
  }
  .play:hover { filter: brightness(1.1); }
  .play:active { transform: scale(.94); }
  .play svg { width: 20px; height: 20px; fill: #0c0c0e; }
  .play .i-stop { display: none; }
  .play.on .i-play { display: none; }
  .play.on .i-stop { display: block; }

  .field { display: flex; flex-direction: column; gap: 5px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
  .field select, .field input[type=number] {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; color: var(--text); min-width: 84px;
  }
  .field input[type=number] { width: 84px; font-variant-numeric: tabular-nums; }
  .field select:focus, .field input:focus { outline: 1px solid var(--accent); }
  .field input[type=range] { width: 110px; margin-top: 8px; }

  input[type=range] { -webkit-appearance: none; appearance: none; height: 3px; border-radius: 3px; background: var(--line); cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--text); border: 0; }

  /* ---------- Scope & Grid ---------- */
  .scope { height: 110px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .scope canvas { width: 100%; height: 100%; display: block; }

  #grid { overflow-x: auto; padding-bottom: 4px; }
  .row { display: grid; grid-template-columns: 210px 1fr; gap: 14px; align-items: center; padding: 5px 0; min-width: 860px; }
  .head { display: flex; align-items: center; gap: 10px; padding: 0 4px; border-radius: 8px; transition: background .1s; }
  .head.hit { background: color-mix(in srgb, var(--c) 22%, transparent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .name { font-size: 13px; font-weight: 500; flex: 1; }
  .name small { color: var(--mute); font-weight: 400; margin-left: 6px; font-size: 10px; }
  .mute { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--mute); font-size: 10px; font-weight: 700; cursor: pointer; }
  .mute.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .head input[type=range] { width: 64px; }

  .cells { display: flex; gap: 4px; }
  .cell {
    flex: 1; height: 40px; border: 0; border-radius: 6px; background: var(--cell); cursor: pointer;
    font-size: 10px; font-weight: 700; color: rgba(12,12,14,.8); touch-action: manipulation; transition: filter .06s;
  }
  .cell.beat { background: var(--cell-beat); }
  .cell:nth-child(4n):not(:last-child) { margin-right: 9px; }
  .cell:hover { filter: brightness(1.25); }
  .cell[data-v="1"] { background: color-mix(in srgb, var(--c) 40%, var(--cell)); }
  .cell[data-v="2"] { background: color-mix(in srgb, var(--c) 72%, var(--cell)); }
  .cell[data-v="3"] { background: var(--c); }
  .cell.now { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }

  /* ---------- Code Studio Tab ---------- */
  .code-container { display: grid; grid-template-columns: 1fr 300px; gap: 16px; min-height: 400px; }
  .code-editor {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
    font-family: 'Fira Code', monospace; font-size: 14px; line-height: 1.6; color: #a9b7c6;
    resize: vertical; outline: none; width: 100%; min-height: 350px; direction: ltr; text-align: left;
  }
  .code-editor:focus { border-color: var(--accent); }
  .code-controls { display: flex; flex-direction: column; gap: 12px; }
  .console-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
    flex: 1; font-family: 'Fira Code', monospace; font-size: 12px; overflow-y: auto; color: var(--mute); direction: ltr; text-align: left;
  }
  .console-log { margin-bottom: 6px; }
  .console-log.success { color: #4fcfa6; }
  .console-log.error { color: #ff5a36; }

  /* ---------- Footer ---------- */
  .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; color: var(--mute); font-size: 12px; }
  .btns { display: flex; gap: 8px; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; transition: border-color .12s; }
  .btn:hover { border-color: var(--mute); }
  .btn.rec.on { border-color: var(--accent); color: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 11px; color: var(--text); }
</style>
</head>
<body>
<div class="app">

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('seq-tab', this)">Sequencer</button>
    <button class="tab-btn" onclick="switchTab('code-tab', this)">Sonic Pi Code Studio</button>
  </div>

  <header class="top">
    <div class="brand">BEATS<i>/</i>VAULT</div>
    <div class="transport">
      <button id="play" class="play" aria-label="Play / Stop">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      </button>
      <label class="field">BPM<input id="bpm" type="number" min="60" max="200" value="120"></label>
      <label class="field">Swing<input id="swing" type="range" min="0" max="60" value="0"></label>
      <label class="field">Key<select id="root"></select></label>
      <label class="field">Scale<select id="scale"></select></label>
      <label class="field">Preset<select id="preset"></select></label>
      <label class="field">Master<input id="master" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    </div>
  </header>

  <section class="scope"><canvas id="scope"></canvas></section>

  <!-- Sequencer Tab -->
  <div id="seq-tab" class="tab-content active">
    <main id="grid"></main>
  </div>

  <!-- Sonic Pi Code Studio Tab -->
  <div id="code-tab" class="tab-content">
    <div class="code-container">
      <textarea id="sonic-code" class="code-editor" spellcheck="false"># Sonic Pi Beat Script
use_bpm 140
use_synth :dsaw

# Kick & Bass Intro
sample :bd_haus
play :C2
sleep 0.5

sample :bd_haus
play :C2
sleep 0.5

# Snare Drop
sample :snare
play :D3
sleep 0.5

play :D#3
sleep 0.25
play :F3
sleep 0.25</textarea>
      <div class="code-controls">
        <button id="run-code-btn" class="btn" style="background: var(--accent); color: #0c0c0e; font-weight: 700;">▶ הרץ קוד</button>
        <button id="stop-code-btn" class="btn">■ עצור קוד</button>
        <div id="code-console" class="console-box">
          <div class="console-log success">[System] Sonic Pi Engine Ready.</div>
        </div>
      </div>
    </div>
  </div>

  <footer class="foot">
    <div class="btns">
      <button id="rand" class="btn">Randomize</button>
      <button id="clear" class="btn">Clear</button>
      <button id="rec" class="btn rec">Rec</button>
    </div>
    <div>
      <kbd>Space</kbd> play   <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd><kbd>G</kbd><kbd>H</kbd><kbd>J</kbd><kbd>K</kbd> live pads
    </div>
  </footer>

</div>

<script>
function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  btn.classList.add('active');
}

(() => {
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const STEPS = 16;
const VEL = [0, 0.5, 0.8, 1];
const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const SCALES = {
  Minor:    [0, 2, 3, 5, 7, 8, 10],
  Major:    [0, 2, 4, 5, 7, 9, 11],
  Dorian:   [0, 2, 3, 5, 7, 9, 10],
  Phrygian: [0, 1, 3, 5, 7, 8, 10],
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const STORE_KEY = 'beats-seq-v2';

let ctx, masterGain, comp, analyser, recDest, reverbIn, noiseBuf;
const trackOut = [];
const curveCache = {};

function initAudio() {
  if (ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });

  masterGain = ctx.createGain();
  masterGain.gain.value = +$('#master').value;

  comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -13;
  comp.knee.value = 10;
  comp.ratio.value = 4;
  comp.attack.value = 0.004;
  comp.release.value = 0.18;

  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.6;

  recDest = ctx.createMediaStreamDestination();

  masterGain.connect(comp);
  comp.connect(analyser);
  analyser.connect(ctx.destination);
  comp.connect(recDest);

  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  const conv = ctx.createConvolver();
  conv.buffer = makeImpulse(1.9, 3.1);
  const rvHP = filt('highpass', 280);
  const rvOut = gain(0.55);
  reverbIn = gain(1);
  reverbIn.connect(rvHP); rvHP.connect(conv); conv.connect(rvOut); rvOut.connect(masterGain);

  TRACKS.forEach((t, i) => {
    const g = gain(state.vol[i]);
    const send = gain(t.reverb);
    g.connect(masterGain);
    g.connect(send);
    send.connect(reverbIn);
    trackOut[i] = g;
  });
}

function makeImpulse(seconds, decay) {
  const len = Math.floor(ctx.sampleRate * seconds);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}

const gain = (v = 1) => { const g = ctx.createGain(); g.gain.value = v; return g; };
const filt = (type, f, q = 1) => { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
function osc(type, f, t, dur) {
  const o = ctx.createOscillator();
  o.type = type; o.frequency.setValueAtTime(f, t);
  o.start(t); o.stop(t + dur);
  return o;
}
function noise(t, dur) {
  const s = ctx.createBufferSource();
  s.buffer = noiseBuf; s.loop = true;
  s.start(t, Math.random() * 1.5); s.stop(t + dur);
  return s;
}
function env(param, t, peak, attack, decay) {
  param.setValueAtTime(0.0001, t);
  param.linearRampToValueAtTime(peak, t + attack);
  param.exponentialRampToValueAtTime(0.0001, t + attack + decay);
}
function softClip(k) {
  if (curveCache[k]) return curveCache[k];
  const n = 1024, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); }
  return (curveCache[k] = c);
}
function shaper(k) { const s = ctx.createWaveShaper(); s.curve = softClip(k); s.oversample = '2x'; return s; }

function kick(t, v, out) {
  const o = osc('sine', 170, t, 0.8);
  o.frequency.exponentialRampToValueAtTime(52, t + 0.1);
  o.frequency.exponentialRampToValueAtTime(38, t + 0.55);
  const g = gain(); env(g.gain, t, v * 1.05, 0.002, 0.58);
  const sat = shaper(2.4);
  o.connect(g); g.connect(sat); sat.connect(out);

  const n = noise(t, 0.04), hp = filt('highpass', 1800), cg = gain();
  env(cg.gain, t, v * 0.32, 0.001, 0.022);
  n.connect(hp); hp.connect(cg); cg.connect(out);
}

function snare(t, v, out) {
  const n = noise(t, 0.35), hp = filt('highpass', 1500), ng = gain();
  env(ng.gain, t, v * 0.7, 0.001, 0.2);
  n.connect(hp); hp.connect(ng); ng.connect(out);

  const o1 = osc('triangle', 250, t, 0.3);
  o1.frequency.exponentialRampToValueAtTime(160, t + 0.07);
  const g1 = gain(); env(g1.gain, t, v * 0.65, 0.001, 0.12);
  o1.connect(g1); g1.connect(out);

  const o2 = osc('sine', 185, t, 0.3);
  const g2 = gain(); env(g2.gain, t, v * 0.35, 0.001, 0.09);
  o2.connect(g2); g2.connect(out);
}

function clap(t, v, out) {
  const bursts = [0, 0.011, 0.023, 0.036];
  bursts.forEach((off, k) => {
    const last = k === bursts.length - 1;
    const n = noise(t + off, 0.4), bp = filt('bandpass', 1250, 0.9), g = gain();
    env(g.gain, t + off, v * (last ? 0.85 : 0.6), 0.001, last ? 0.2 : 0.012);
    n.connect(bp); bp.connect(g); g.connect(out);
  });
}

const HAT_RATIOS = [2, 3, 4.16, 5.43, 6.79, 8.21];
function hat(open) {
  return (t, v, out) => {
    const dur = open ? 0.42 : 0.065;
    const g = gain(); env(g.gain, t, v * 0.3, 0.001, dur);
    const bp = filt('bandpass', 10200, 0.6), hp = filt('highpass', 7000);
    HAT_RATIOS.forEach(r => { const o = osc('square', 40 * r, t, dur + 0.05); o.connect(bp); });
    const n = noise(t, dur + 0.05), nh = filt('highpass', 8500), ng = gain(0.5);
    n.connect(nh); nh.connect(ng); ng.connect(bp);
    bp.connect(hp); hp.connect(g); g.connect(out);
  };
}

function perc(t, v, out) {
  const o = osc('sine', 430, t, 0.3);
  o.frequency.exponentialRampToValueAtTime(290, t + 0.12);
  const g = gain(); env(g.gain, t, v * 0.7, 0.001, 0.17);
  o.connect(g); g.connect(out);
  const n = noise(t, 0.03), bp = filt('bandpass', 3200, 2), ng = gain();
  env(ng.gain, t, v * 0.35, 0.001, 0.018);
  n.connect(bp); bp.connect(ng); ng.connect(out);
}

function bass(t, v, out, f) {
  const dur = Math.min(1.0, 60 / state.bpm * 1.3);
  const o = osc('sine', f * 2, t, dur + 0.1);
  o.frequency.exponentialRampToValueAtTime(f, t + 0.045);
  const tri = osc('triangle', f, t, dur + 0.1);
  const tg = gain(0.22);
  const g = gain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(v * 0.95, t + 0.005);
  g.gain.setTargetAtTime(0.0001, t + dur * 0.3, dur * 0.22);
  const sat = shaper(3.2);
  o.connect(g); tri.connect(tg); tg.connect(g);
  g.connect(sat); sat.connect(out);
}

function keys(t, v, out, f) {
  const dur = 1.0;
  const lp = filt('lowpass', 5200, 3.5);
  lp.frequency.setValueAtTime(5200, t);
  lp.frequency.exponentialRampToValueAtTime(520, t + 0.4);
  [-8, 8].forEach(d => { const o = osc('sawtooth', f, t, dur + 0.1); o.detune.value = d; o.connect(lp); });
  const sub = osc('triangle', f / 2, t, dur + 0.1), sg = gain(0.35);
  sub.connect(sg); sg.connect(lp);
  const g = gain(); env(g.gain, t, v * 0.2, 0.004, dur);
  lp.connect(g); g.connect(out);
}

const TRACKS = [
  { id: 'kick',  name: 'Kick',     type: 'drum', color: '#ff5a36', key: 'a', gain: 0.95, reverb: 0,    voice: kick },
  { id: 'snare', name: 'Snare',    type: 'drum', color: '#ff8a3d', key: 's', gain: 0.8,  reverb: 0.18, voice: snare },
  { id: 'clap',  name: 'Clap',     type: 'drum', color: '#ffb347', key: 'd', gain: 0.7,  reverb: 0.3,  voice: clap },
  { id: 'hat',   name: 'Hi-hat',   type: 'drum', color: '#e6d34f', key: 'f', gain: 0.6,  reverb: 0.05, voice: hat(false) },
  { id: 'ohat',  name: 'Open hat', type: 'drum', color: '#9ccf5a', key: 'g', gain: 0.55, reverb: 0.12, voice: hat(true) },
  { id: 'perc',  name: 'Perc',     type: 'drum', color: '#4fcfa6', key: 'h', gain: 0.7,  reverb: 0.15, voice: perc },
  { id: 'bass',  name: '808',      type: 'note', color: '#4aa8ff', key: 'j', gain: 0.9,  reverb: 0,    voice: bass, defDeg: 0 },
  { id: 'keys',  name: 'Keys',     type: 'note', color: '#8d7dff', key: 'k', gain: 0.6,  reverb: 0.35, voice: keys, defDeg: 4 },
];

const state = {
  bpm: 120, swing: 0, root: 0, scale: 'Minor', playing: false,
  pattern: TRACKS.map(t => Array(STEPS).fill(t.type === 'drum' ? 0 : -1)),
  vol: TRACKS.map(t => t.gain),
  mute: TRACKS.map(() => false),
};

const PRESETS = {
  'Trap': { bpm: 140, swing: 0, root: 6, scale: 'Minor', p: {
    kick:  'X..-..x.....X...', snare: '........X.......', clap: '........x.......',
    hat:   'x-x-x-x-x-x-xxx-', ohat:  '......X.......X.', perc: '..-...-...-..-..',
    bass:  '0..0..3...0..5..', keys:  '4...2...3...1...' } },
  'Boom Bap': { bpm: 90, swing: 22, root: 2, scale: 'Minor', p: {
    kick:  'X.....x..x.X....', snare: '....X.......X...', clap: '....-.......-...',
    hat:   'x-x-x-x-x-x-x-x-', ohat:  '..............X.', perc: '...-......-.....',
    bass:  '0.....0..0.3....', keys:  '2..4....3.......' } },
  'Empty': { bpm: 120, swing: 0, root: 0, scale: 'Minor', p: {} },
};

const stepDur = () => 60 / state.bpm / 4;
let step = 0, nextTime = 0;
const queue = [];

const timer = new Worker(URL.createObjectURL(new Blob([
  "let id;onmessage=e=>{if(e.data==='start'){clearInterval(id);id=setInterval(()=>postMessage(0),25)}else{clearInterval(id)}}"
])));
timer.onmessage = () => schedule();

function schedule() {
  if (!state.playing) return;
  while (nextTime < ctx.currentTime + 0.12) {
    const sd = stepDur();
    const when = nextTime + (step % 2 ? state.swing / 100 * sd * 0.55 : 0);
    playStep(step, when);
    queue.push({ step, time: when });
    nextTime += sd;
    step = (step + 1) % STEPS;
  }
}

function playStep(s, time) {
  TRACKS.forEach((t, i) => {
    if (state.mute[i]) return;
    trigger(i, time, state.pattern[i][s], 0.94 + Math.random() * 0.06);
  });
}

function trigger(i, time, val, jitter = 1) {
  const t = TRACKS[i];
  if (t.type === 'drum') {
    if (val > 0) t.voice(time, VEL[val] * jitter, trackOut[i]);
  } else if (val >= 0) {
    t.voice(time, 0.9 * jitter, trackOut[i], mtof(noteMidi(t, val)));
  }
}

function noteMidi(track, d) {
  const sc = SCALES[state.scale];
  const semi = sc[d % sc.length] + 12 * Math.floor(d / sc.length);
  let base = track.id === 'bass' ? 24 + state.root : 60 + state.root;
  if (track.id === 'bass' && base < 31) base += 12;
  return base + semi;
}
const noteName = (track, d) => NOTES[noteMidi(track, d) % 12];

async function start() {
  initAudio();
  await ctx.resume();
  step = 0; queue.length = 0;
  nextTime = ctx.currentTime + 0.06;
  state.playing = true;
  timer.postMessage('start');
  $('#play').classList.add('on');
}
function stop() {
  state.playing = false;
  timer.postMessage('stop');
  queue.length = 0;
  setPlayhead(-1);
  $('#play').classList.remove('on');
}
const toggle = () => (state.playing ? stop() : start());

function preview(i, val) {
  initAudio(); ctx.resume();
  trigger(i, ctx.currentTime + 0.01, val, 1);
}

/* ---------- Grid Setup ---------- */
const grid = $('#grid');
const cells = [];
const heads = [];
let playheadStep = -1;

function buildGrid() {
  grid.innerHTML = '';
  TRACKS.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.setProperty('--c', t.color);

    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML =
      '<span class="dot"></span>' +
      '<span class="name">' + t.name + '<small>' + t.key.toUpperCase() + '</small></span>' +
      '<button class="mute" title="Mute">M</button>' +
      '<input type="range" min="0" max="1.2" step="0.01" title="Volume">';
    const muteBtn = head.querySelector('.mute');
    const vol = head.querySelector('input');
    vol.value = state.vol[i];
    muteBtn.classList.toggle('on', state.mute[i]);
    muteBtn.onclick = () => { state.mute[i] = !state.mute[i]; muteBtn.classList.toggle('on', state.mute[i]); };
    vol.oninput = () => {
      state.vol[i] = +vol.value;
      if (trackOut[i]) trackOut[i].gain.setTargetAtTime(state.vol[i], ctx.currentTime, 0.01);
    };
    heads[i] = head;

    const wrap = document.createElement('div');
    wrap.className = 'cells';
    cells[i] = [];
    for (let s = 0; s < STEPS; s++) {
      const b = document.createElement('button');
      b.className = 'cell' + (s % 4 === 0 ? ' beat' : '');
      b.dataset.t = i; b.dataset.s = s;
      wrap.appendChild(b);
      cells[i][s] = b;
    }
    row.append(head, wrap);
    grid.appendChild(row);
  });
  repaintAll();
}

function paintCell(i, s) {
  const b = cells[i][s], t = TRACKS[i], v = state.pattern[i][s];
  if (t.type === 'drum') { b.dataset.v = v; b.textContent = ''; }
  else { b.dataset.v = v >= 0 ? 3 : 0; b.textContent = v >= 0 ? noteName(t, v) : ''; }
}
function repaintAll() { TRACKS.forEach((_, i) => { for (let s = 0; s < STEPS; s++) paintCell(i, s); }); }

function setPlayhead(s) {
  if (playheadStep >= 0) cells.forEach(r => r[playheadStep].classList.remove('now'));
  playheadStep = s;
  if (s >= 0) cells.forEach(r => r[s].classList.add('now'));
}

/* ---------- Sonic Pi Engine Integration ---------- */
class SonicPiInterpreter {
  constructor() {
    this.bpm = 120;
    this.synth = 'sine';
    this.timeouts = [];
  }

  log(msg, type = '') {
    const consoleBox = $('#code-console');
    const time = new Date().toTimeString().split(' ')[0];
    const el = document.createElement('div');
    el.className = `console-log ${type}`;
    el.textContent = `[${time}] ${msg}`;
    consoleBox.appendChild(el);
    consoleBox.scrollTop = consoleBox.scrollHeight;
  }

  stop() {
    this.timeouts.forEach(clearTimeout);
    this.timeouts = [];
    this.log('Execution Stopped.');
  }

  run(code) {
    initAudio();
    ctx.resume();
    this.stop();
    this.log('Compiling & Executing Sonic Pi code...', 'success');

    const lines = code.split('\n');
    let currentTime = ctx.currentTime;
    let bpm = 120;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i].trim();
      if (!line || line.startsWith('#')) continue;

      try {
        if (line.startsWith('use_bpm')) {
          bpm = parseFloat(line.split(/\s+/)[1]) || 120;
        } else if (line.startsWith('use_synth')) {
          this.synth = line.split(/\s+/)[1].replace(':', '');
        } else if (line.startsWith('play')) {
          const arg = line.split(/\s+/)[1].replace(':', '');
          const noteTime = currentTime;
          const t = setTimeout(() => {
            keys(noteTime, 0.8, masterGain, mtof(this.parseNote(arg)));
          }, (noteTime - ctx.currentTime) * 1000);
          this.timeouts.push(t);
        } else if (line.startsWith('sample')) {
          const sampleName = line.split(/\s+/)[1].replace(':', '');
          const sampleTime = currentTime;
          const t = setTimeout(() => {
            if (sampleName.includes('snare')) snare(sampleTime, 0.8, masterGain);
            else kick(sampleTime, 0.9, masterGain);
          }, (sampleTime - ctx.currentTime) * 1000);
          this.timeouts.push(t);
        } else if (line.startsWith('sleep')) {
          const beats = parseFloat(line.split(/\s+/)[1]) || 1;
          currentTime += beats * (60 / bpm);
        }
      } catch (err) {
        this.log(`Line ${i + 1} Error: ${err.message}`, 'error');
      }
    }
  }

  parseNote(noteStr) {
    if (!isNaN(noteStr)) return parseFloat(noteStr);
    const notesMap = { 'C': 0, 'C#': 1, 'D': 2, 'D#': 3, 'E': 4, 'F': 5, 'F#': 6, 'G': 7, 'G#': 8, 'A': 9, 'A#': 10, 'B': 11 };
    const match = noteStr.toUpperCase().match(/^([A-G]#?)(-?\d+)$/);
    if (!match) return 60;
    return notesMap[match[1]] + (parseInt(match[2], 10) + 1) * 12;
  }
}

const piEngine = new SonicPiInterpreter();

$('#run-code-btn').onclick = () => piEngine.run($('#sonic-code').value);
$('#stop-code-btn').onclick = () => piEngine.stop();

/* ---------- UI Events & Setup ---------- */
function fillSelect(sel, items, labelFn = x => x) {
  sel.innerHTML = '';
  items.forEach((x, i) => { const o = document.createElement('option'); o.value = x; o.textContent = labelFn(x, i); sel.appendChild(o); });
}
fillSelect($('#root'), NOTES.map((_, i) => i), (_, i) => NOTES[i]);
fillSelect($('#scale'), Object.keys(SCALES));

$('#play').onclick = toggle;
$('#bpm').onchange = e => { state.bpm = Math.min(200, Math.max(60, +e.target.value || 120)); };

/* Scope Renderer */
const cv = $('#scope'), g2 = cv.getContext('2d');
const BARS = 72;
const smooth = new Float32Array(BARS);
let freqData;

function drawScope() {
  const w = cv.width, h = cv.height;
  g2.clearRect(0, 0, w, h);
  if (analyser) {
    if (!freqData) freqData = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(freqData);
  }
  const gap = 3;
  const bw = (w - gap * (BARS - 1)) / BARS;
  for (let b = 0; b < BARS; b++) {
    let v = freqData ? freqData[b * 2] / 255 : 0;
    smooth[b] = Math.max(v, smooth[b] * 0.88);
    const bh = Math.max(2, smooth[b] * h * 0.92);
    g2.fillStyle = 'rgba(255,90,54,' + (0.25 + smooth[b] * 0.75) + ')';
    g2.fillRect(b * (bw + gap), h - bh, bw, bh);
  }
  requestAnimationFrame(drawScope);
}

buildGrid();
drawScope();

})();
</script>
